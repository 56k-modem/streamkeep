name: Release stack

on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[1-9]*"
  # BtbN's scheduled FFmpeg build starts daily at 12:00 UTC and publishes a
  # release after the build succeeds. Release this stack after that build.
  schedule:
    - cron: '0 23 * * *'

concurrency:
  group: release-stack
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" = "schedule" ]]; then
              RELEASE_DATE="$(date --utc +%Y.%m.%d)"
              LAST_SEQUENCE=0

              while IFS= read -r TAG; do
                  SEQUENCE="${TAG##*.}"
                  if [[ "$SEQUENCE" =~ ^[1-9][0-9]*$ ]] && (( SEQUENCE > LAST_SEQUENCE )); then
                      LAST_SEQUENCE="$SEQUENCE"
                  fi
              done < <(git tag --list "${RELEASE_DATE}.*")

              VERSION="${RELEASE_DATE}.$((LAST_SEQUENCE + 1))"
              git tag "$VERSION" "$GITHUB_SHA"
              git push origin "refs/tags/$VERSION"
          else
              VERSION="$REF_NAME"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  validate:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate calendar version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^([0-9]{4}\.[0-9]{2}\.[0-9]{2})\.([1-9][0-9]*)$ ]]; then
              echo "Invalid version: $VERSION (expected YYYY.MM.DD.N)" >&2
              exit 1
          fi

          RELEASE_DATE="${BASH_REMATCH[1]}"
          NORMALIZED_DATE="$(date --date="${RELEASE_DATE//./-}" +%Y.%m.%d)"
          test "$NORMALIZED_DATE" = "$RELEASE_DATE"

      - name: Check shell syntax
        run: find . -type f -name '*.sh' -exec bash -n {} +

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

  publish-images:
    name: ${{ matrix.image }}
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: streamkeep
            legacy_image: streamlink
            context: .
          - image: contact-sheets
            context: ./caddy
          - image: vcsi
            context: ./vcsi
          - image: postproc-trigger
            context: ./postproc-trigger
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
            ${{ matrix.legacy_image && format('ghcr.io/{0}/{1}', github.repository_owner, matrix.legacy_image) || '' }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          no-cache: ${{ matrix.image == 'streamkeep' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  publish-release:
    needs: [prepare, publish-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --generate-notes \
            --verify-tag
